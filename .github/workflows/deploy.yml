name: Build and deploy site

# Requires: repo Settings → Pages → Build and deployment → Source = "GitHub Actions"

on:
    push:
        branches: [master]
    workflow_dispatch:
    workflow_call: # used by update-publications.yml after it commits

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master # pick up the commit just pushed by update-publications

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install build dependencies
              run: pip install jinja2 pillow

            - name: Build site
              run: python scripts/build.py

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
