<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="common.css" />
<style>
    .stage { width: 1920px; height: 1080px; }
    #photo { left: 80px; top: 90px; width: 592px; height: 900px; }
    #cards { position: absolute; left: 760px; top: 90px; width: 1080px; }
    .card { position: relative; padding: 22px 28px 20px; border-radius: 16px; background: var(--panel);
            border-left: 8px solid; margin-bottom: 0; }
    .card.p { border-color: var(--perception); }
    .card.t { border-color: var(--trigger); }
    .card.l { border-color: var(--label); }
    .card h3 { margin: 0; display: flex; align-items: baseline; gap: 14px; font-size: 30px; }
    .card h3 small { font-size: 21px; font-weight: 600; color: var(--muted); }
    .card p { margin: 10px 0 0; font-size: 24.5px; line-height: 1.5; color: var(--soft); min-height: 1.5em; }
    .arrow { height: 46px; display: flex; align-items: center; justify-content: center;
             font-size: 34px; color: #b5b5b5; }
    #labelPill { display: inline-block; margin-top: 10px; padding: 6px 24px; border-radius: 999px;
                 font-size: 32px; font-weight: 700; color: #fff; background: var(--label); }
    #gtNote { margin-left: 12px; font-size: 20px; font-weight: 700; color: var(--gt); }
    svg#links { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="photo" id="photo"><img src="../../../projects/peqemo/media/explore-interior.jpg" alt="" /></div>
    <svg id="links"></svg>
    <div class="cue" id="c0"><span></span></div>
    <div class="cue" id="c1"><span></span></div>
    <div class="cue" id="c2"><span></span></div>

    <div id="cards">
        <div class="card p" id="cardP"><h3><span class="tag perception">1 · Perception</span><small>what is visible</small></h3><p id="perc"></p></div>
        <div class="arrow" id="a1">↓</div>
        <div class="card t" id="cardT"><h3><span class="tag trigger">2 · Trigger</span><small>why it could feel that way</small></h3><p id="trig"></p></div>
        <div class="arrow" id="a2">↓</div>
        <div class="card l" id="cardL"><h3><span class="tag label">3 · Label</span><small>the emotion that follows</small></h3>
            <span id="labelPill">Fear</span><span id="gtNote">★ dataset label</span></div>
    </div>
</div>
<script src="common.js"></script>
<script>
window.SCENE = { width: 1920, height: 1080, duration: 11 };
const $ = (id) => document.getElementById(id);
let J;

// Cue boxes on the interior photo (fractions), labelled with phrases from the Trigger text.
const CUES = [
    { box: { x: 0.48, y: 0.12, w: 0.41, h: 0.38 }, label: "bright light from the doors" },
    { box: { x: 0.02, y: 0.05, w: 0.34, h: 0.47 }, label: "dark, shadowy interior" },
    { box: { x: 0.00, y: 0.60, w: 0.62, h: 0.39 }, label: "crumpled papers and debris" },
];

window.setup = function () {
    J = justification("interior", "Fear");
    CUES.forEach((c, i) => {
        placeCue($("c" + i), $("photo"), c.box);
        $("c" + i).querySelector("span").textContent = c.label;
    });
    $("c1").querySelector("span").style.top = "8px";   // keep label inside the photo at the top edge
    $("c1").querySelector("span").style.left = "8px";
};

function drawLinks(p) {
    // Lines start at the photo's right edge (level with each cue) so they never cross the image,
    // and end at the Trigger card's left edge.
    const svg = $("links");
    const card = $("cardT").getBoundingClientRect();
    const photo = $("photo").getBoundingClientRect();
    const tx = card.left, ty = card.top + card.height / 2;
    svg.innerHTML = [0, 1, 2].map((i) => {
        const r = $("c" + i).getBoundingClientRect();
        const sx = photo.right + 6, sy = r.top + r.height / 2;
        const len = Math.hypot(tx - sx, ty - sy) * 1.3;
        return `<circle cx="${sx}" cy="${sy}" r="7" fill="#9f5bd3" opacity="${p > 0 ? 1 : 0}"/>
                <path d="M${sx},${sy} C${sx + 50},${sy} ${tx - 50},${ty} ${tx},${ty}" fill="none"
                 stroke="#9f5bd3" stroke-width="4" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - p)}"
                 opacity="${p > 0 ? 0.85 : 0}"/>`;
    }).join("");
}

window.seek = function (t) {
    const outro = 1 - prog(t, 10.4, 11);
    $("stage").style.opacity = prog(t, 0, 0.4) * outro;
    fade($("photo"), prog(t, 0, 0.6));

    fade($("cardP"), prog(t, 0.4, 0.8));
    type($("perc"), sentences(J.perception, 2), lin(t, 0.8, 3.8));
    [0, 1, 2].forEach((i) => {
        $("c" + i).style.opacity = prog(t, 1.2 + i * 0.8, 1.6 + i * 0.8);
        $("c" + i).classList.toggle("is-trigger", t >= 4.3);
    });

    fade($("a1"), prog(t, 4.0, 4.3));
    fade($("cardT"), prog(t, 4.1, 4.5));
    drawLinks(prog(t, 4.3, 5.2));
    type($("trig"), sentences(J.trigger, 2), lin(t, 4.6, 8.2));

    fade($("a2"), prog(t, 8.3, 8.6));
    pop($("cardL"), prog(t, 8.5, 9.1));
};
</script>
</body>
</html>
