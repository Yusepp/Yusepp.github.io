<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="common.css" />
<style>
    .stage { width: 1920px; height: 1080px; }
    #kicker { position: absolute; left: 80px; top: 52px; }
    #headline { position: absolute; left: 80px; top: 86px; font-size: 38px; font-weight: 700; }
    #photo { left: 80px; top: 170px; width: 820px; height: 615px; }
    #panel { position: absolute; left: 960px; top: 170px; width: 880px; }
    .row-label { font-size: 20px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
    .block { margin-top: 22px; }
    .block p { margin: 10px 0 0; font-size: 26px; line-height: 1.5; color: var(--soft); min-height: 1.5em; }
    #labelPill { display: inline-block; margin-top: 12px; padding: 8px 24px; border-radius: 999px;
                 font-size: 32px; font-weight: 700; color: #fff; background: var(--label); }
    #gtNote { display: inline-block; margin-left: 12px; font-size: 20px; font-weight: 700; color: var(--gt); }
    #caption { position: absolute; left: 80px; width: 820px; top: 818px; text-align: left;
               font-size: 29px; line-height: 1.35; font-weight: 600; color: var(--text); }
    #caption em { font-style: normal; color: var(--ours); }
    #footer { position: absolute; left: 80px; bottom: 44px; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="kicker" id="kicker">PeqEMO</div>
    <div id="headline">One image. Many grounded emotional readings.</div>

    <div class="photo" id="photo"><img src="../../../projects/peqemo/media/explore-pansies.jpg" alt="" /></div>
    <div class="cue" id="cue1"><span id="cue1l"></span></div>
    <div class="cue" id="cue2"><span id="cue2l"></span></div>

    <div id="panel">
        <div class="row-label" id="chipsLabel">Explain this image as…</div>
        <div id="chips"></div>
        <div class="block" id="bPerc"><span class="tag perception">Perception</span><p id="perc"></p></div>
        <div class="block" id="bTrig"><span class="tag trigger">Trigger</span><p id="trig"></p></div>
        <div class="block" id="bLab"><span class="tag label">Label</span><br />
            <span id="labelPill"></span><span id="gtNote">★ dataset label</span></div>
    </div>

    <div id="caption">Same pixels, different emotion:<br /><em>every reading points at what is actually in the image.</em></div>
    <div id="footer">Conditioned justifications generated by PeqEMO (Appendix F of the paper)</div>
</div>
<script src="common.js"></script>
<script>
window.SCENE = { width: 1920, height: 1080, duration: 17 };

const EMOS = ["Amusement", "Anger", "Awe", "Contentment", "Disgust", "Excitement", "Fear", "Sadness"];
const $ = (id) => document.getElementById(id);
let A, F, chips;

// Cue boxes (fractions of the photo), placed by hand on the pansies photo.
const CUE_CLUSTER = { x: 0.23, y: 0.13, w: 0.62, h: 0.56 };
const CUE_BLOOM = { x: 0.35, y: 0.47, w: 0.30, h: 0.33 };

window.setup = function () {
    A = justification("pansies", "Amusement");
    F = justification("pansies", "Fear");
    const gt = explorerItem("pansies").groundTruth;
    $("chips").innerHTML = EMOS.map((e) => `<span class="chip${e === gt ? " gt" : ""}" data-e="${e}">${e}</span>`).join("");
    chips = [...document.querySelectorAll(".chip")];
    placeCue($("cue1"), $("photo"), CUE_CLUSTER);
    placeCue($("cue2"), $("photo"), CUE_BLOOM);
};

function select(emotion) {
    chips.forEach((c) => c.classList.toggle("on", c.dataset.e === emotion));
}

window.seek = function (t) {
    const outro = 1 - prog(t, 16.4, 17);           // fade everything out to loop cleanly
    fade($("kicker"), prog(t, 0, 0.6));
    fade($("headline"), prog(t, 0.1, 0.8));
    fade($("photo"), prog(t, 0.2, 1.0));
    fade($("chipsLabel"), prog(t, 0.8, 1.2));
    chips.forEach((c, i) => fade(c, prog(t, 0.8 + i * 0.04, 1.2 + i * 0.04), 8));

    const fear = t >= 9.9;
    const J = fear ? F : A;
    select(t < 1.3 ? null : fear ? "Fear" : "Amusement");

    // Phase A (amusement): 1.4-9.9 ; phase B (fear): 9.9-16.4
    const base = fear ? 10.2 : 1.4;
    // In phase B the perception (same image) appears at once; only the trigger is typed again
    const percP = fear ? lin(t, 10.2, 10.25) : lin(t, 1.5, 4.6);
    const trigP = fear ? lin(t, 10.6, 13.6) : lin(t, 4.9, 8.2);
    const labP = fear ? prog(t, 13.8, 14.3) : prog(t, 8.4, 8.9);
    const blockOut = fear ? 1 : 1 - prog(t, 9.5, 9.9);

    fade($("bPerc"), Math.min(prog(t, base - 0.1, base + 0.2), blockOut), 10);
    fade($("bTrig"), Math.min(prog(t, (fear ? 10.5 : 4.8), (fear ? 10.7 : 5.0)), blockOut), 10);
    type($("perc"), sentences(J.perception, 2), percP);
    type($("trig"), sentences(J.trigger, 2), trigP);
    pop($("bLab"), Math.min(labP, blockOut));
    $("labelPill").textContent = fear ? "Fear" : "Amusement";
    $("gtNote").style.display = fear ? "none" : "inline-block";

    // Cue boxes: blue while describing (perception), purple while reasoning (trigger)
    const inTrig = trigP > 0;
    const c1 = fear ? prog(t, 10.2, 10.6) : prog(t, 2.0, 2.4);
    const c2 = fear ? prog(t, 11.4, 11.8) : prog(t, 3.2, 3.6);
    [["cue1", c1], ["cue2", c2]].forEach(([id, p]) => {
        $(id).style.opacity = Math.min(p, blockOut);
        $(id).classList.toggle("is-trigger", inTrig);
    });
    // Cue labels quote phrases from the Trigger sentences shown on screen
    $("cue1l").textContent = fear ? "tightly packed flowers" : "purple & orange-yellow petals";
    $("cue2l").textContent = fear ? "vibrant petals vs dark leaves" : "dense, abundant arrangement";

    fade($("caption"), prog(t, 14.4, 15.0));
    fade($("footer"), prog(t, 1.0, 1.6));
    $("stage").style.opacity = prog(t, 0, 0.4) * outro;
};
</script>
</body>
</html>
